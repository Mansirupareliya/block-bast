<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff52b"/>
      <stop offset=".42" stop-color="#ffd000"/>
      <stop offset=".78" stop-color="#ffae00"/>
      <stop offset="1" stop-color="#f58a00"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff84a"/>
      <stop offset="1" stop-color="#ffbd00"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".55" stop-color="#fff0d8"/>
      <stop offset="1" stop-color="#ffe8c5"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0442d"/>
      <stop offset="1" stop-color="#d91f22"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f1f1"/>
      <stop offset="1" stop-color="#bfc1c3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="dialClip"><circle cx="256" cy="282" r="84"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <!-- side pushers -->
    <g transform="rotate(-42 174 177)">
      <rect x="151" y="151" width="43" height="53" rx="17" fill="url(#steel)"/>
      <rect x="155" y="155" width="35" height="42" rx="14" fill="#dedfe0"/>
    </g>
    <g transform="rotate(42 338 177)">
      <rect x="318" y="151" width="43" height="53" rx="17" fill="url(#steel)"/>
      <rect x="322" y="155" width="35" height="42" rx="14" fill="#dedfe0"/>
    </g>

    <!-- top button and stem -->
    <rect x="241" y="87" width="30" height="31" rx="7" fill="#ff9f00"/>
    <rect x="226" y="63" width="60" height="34" rx="10" fill="url(#goldLight)"/>
    <path d="M236 68h40" stroke="#fff85c" stroke-width="5" stroke-linecap="round" opacity=".75"/>

    <!-- stopwatch body -->
    <circle cx="256" cy="282" r="157" fill="url(#gold)"/>
    <circle cx="256" cy="282" r="148" fill="#ffcf00" opacity=".75"/>
    <circle cx="256" cy="282" r="139" fill="url(#goldLight)"/>
    <circle cx="256" cy="282" r="126" fill="#f4a900" opacity=".45"/>
    <circle cx="256" cy="282" r="118" fill="url(#face)" stroke="#f7a900" stroke-width="8"/>

    <!-- dial marks -->
    <g clip-path="url(#dialClip)" stroke="#f6b37c" stroke-width="7" stroke-linecap="round" opacity=".9">
      <path d="M256 203v19"/>
      <path d="M256 342v19"/>
      <path d="M177 282h19"/>
      <path d="M316 282h19"/>
      <path d="M200 226l12 13"/>
      <path d="M300 326l13 13"/>
      <path d="M312 226l-13 13"/>
      <path d="M200 338l13-13"/>
    </g>

    <!-- hand -->
    <path d="M256 282 L303 222 Q309 214 316 221 Q322 227 315 235 L270 289 Z" fill="url(#red)"/>
    <circle cx="256" cy="289" r="31" fill="#d92324"/>
    <circle cx="256" cy="289" r="14" fill="#f34a35"/>

    <!-- glass reflections -->
    <path d="M181 229c17-25 42-39 67-39 13 0 19 9 15 21-9 25-34 48-59 57-20 7-37-17-23-39z"
          fill="#ffffff" opacity=".68"/>
    <path d="M169 216c5-10 12-18 21-24" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".5"/>
    <path d="M337 356c8 7 14 15 18 24" fill="none" stroke="#fff7d7" stroke-width="13" stroke-linecap="round" opacity=".35"/>
    <path d="M145 246c-5 17-7 31-7 47" fill="none" stroke="#fff45a" stroke-width="7" stroke-linecap="round" opacity=".45"/>
  </g>
</svg>